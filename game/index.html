<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Midnight Ramen — a one-cook noodle counter</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14100e; }
  body { display: grid; place-items: center; }
  #game { display: block; image-rendering: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Midnight Ramen: build each customer's bowl in the order printed on their ticket, then serve it before they lose patience"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
